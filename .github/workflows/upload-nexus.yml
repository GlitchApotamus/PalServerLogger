name: Upload Mod To Nexus

on:
  workflow_run:
    workflows: ["Auto Release"]
    types: [completed]

jobs:
  upload-to-nexus:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXUS_API_BASE: https://api.nexusmods.com/v3
      NEXUS_MOD_ID: "3647"
      NEXUS_FILE_ID: "REPLACE_WITH_FILE_ID"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download latest release zip
        id: release_zip
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          repo="${{ github.repository }}"
          mkdir -p .release-artifacts

          gh release download --repo "$repo" --pattern "PalServerLogger-*.zip" --dir .release-artifacts

          zip_path="$(find .release-artifacts -type f -name 'PalServerLogger-*.zip' | sort | tail -n 1)"
          if [ -z "$zip_path" ]; then
            echo "No PalServerLogger zip asset found in the latest release."
            exit 1
          fi

          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$zip_path")" >> "$GITHUB_OUTPUT"
          ls -l .release-artifacts

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "version.txt" -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "version.txt is empty or missing."
          }

          $fileVersion = "1.$version"
          "file_version=$fileVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Using Nexus version: $fileVersion"

      - name: Validate Nexus file metadata
        shell: pwsh
        run: |
          if ("${{ env.NEXUS_FILE_ID }}" -eq "REPLACE_WITH_FILE_ID") {
            throw "Set NEXUS_FILE_ID in the workflow to the existing Nexus file ID for this mod before running the upload step. You can find it in the Nexus mod's Files tab under API Info."
          }

          if ([string]::IsNullOrWhiteSpace("${{ secrets.NEXUS_API_KEY }}")) {
            throw "NEXUS_API_KEY is not set."
          }

      - name: Upload zip to Nexus
        uses: Nexus-Mods/upload-action@v1
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ env.NEXUS_FILE_ID }}
          filename: ${{ steps.release_zip.outputs.zip_name }}
          version: ${{ steps.version.outputs.file_version }}
          display_name: "PalServerLogger"
          category: main
          archive_existing_version: false
          primary_mod_manager_download: false
          allow_mod_manager_download: false
          show_requirements_pop_up: false
          update_mod_version: true
