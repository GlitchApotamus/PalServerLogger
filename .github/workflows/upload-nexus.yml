name: Upload Mod To Nexus

on:
  workflow_run:
    workflows: ["Auto Release"]
    types: [completed]

jobs:
  upload-to-nexus:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NEXUS_API_BASE: https://api.nexusmods.com/v3
      NEXUS_MOD_ID: "3647"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download latest release zip
        id: release_zip
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          repo="${{ github.repository }}"
          mkdir -p .release-artifacts

          gh release download --repo "$repo" --pattern "PalServerLogger-*.zip" --dir .release-artifacts

          zip_path="$(find .release-artifacts -type f -name 'PalServerLogger-*.zip' | sort | tail -n 1)"
          if [ -z "$zip_path" ]; then
            echo "No PalServerLogger zip asset found in the latest release."
            exit 1
          fi

          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$zip_path")" >> "$GITHUB_OUTPUT"
          ls -l .release-artifacts

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "version.txt" -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "version.txt is empty or missing."
          }

          $fileVersion = "1.$version"
          "file_version=$fileVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Using Nexus version: $fileVersion"

      - name: Upload zip to Nexus
        shell: pwsh
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          ZIP_PATH: ${{ steps.release_zip.outputs.zip_path }}
          FILE_NAME: "PalServerLogger"
          FILE_VERSION: ${{ steps.version.outputs.file_version }}
          FILE_CATEGORY: "main"
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not $env:NEXUS_API_KEY) {
            throw "NEXUS_API_KEY is not set."
          }

          if (-not (Test-Path -LiteralPath $env:ZIP_PATH)) {
            throw "No zip file found at path: $env:ZIP_PATH"
          }

          $zipFile = Get-Item -LiteralPath $env:ZIP_PATH
          $zipName = $zipFile.Name
          $zipSize = [int64]$zipFile.Length
          $fileVersion = $env:FILE_VERSION

          if ([string]::IsNullOrWhiteSpace($fileVersion)) {
            throw "Could not determine file version."
          }

          $headers = @{
            "apikey" = $env:NEXUS_API_KEY
            "Content-Type" = "application/json"
          }

          Write-Host "Creating upload session for $zipName ($zipSize bytes)..."
          $createUploadBody = @{
            size_bytes = $zipSize
            filename = $zipName
          } | ConvertTo-Json

          $createUploadResp = Invoke-RestMethod `
            -Method POST `
            -Uri "$env:NEXUS_API_BASE/uploads" `
            -Headers $headers `
            -Body $createUploadBody

          $uploadId = $createUploadResp.data.id
          $presignedUrl = $createUploadResp.data.presigned_url

          if ([string]::IsNullOrWhiteSpace($uploadId) -or [string]::IsNullOrWhiteSpace($presignedUrl)) {
            throw "Create upload response missing id or presigned_url."
          }

          Write-Host "Uploading zip data to presigned URL..."
          $uploadHeaders = @{
            "Content-Disposition" = "attachment; filename=`"$zipName`""
            "Content-Type" = "application/octet-stream"
          }

          Invoke-RestMethod `
            -Method PUT `
            -Uri $presignedUrl `
            -Headers $uploadHeaders `
            -InFile $zipFile.FullName

          Write-Host "Finalising upload session $uploadId..."
          Invoke-RestMethod `
            -Method POST `
            -Uri "$env:NEXUS_API_BASE/uploads/$uploadId/finalise" `
            -Headers @{ "apikey" = $env:NEXUS_API_KEY }

          $maxAttempts = 30
          $delaySeconds = 5
          $isAvailable = $false

          for ($i = 1; $i -le $maxAttempts; $i++) {
            $statusResp = Invoke-RestMethod `
              -Method GET `
              -Uri "$env:NEXUS_API_BASE/uploads/$uploadId" `
              -Headers @{ "apikey" = $env:NEXUS_API_KEY }

            $state = $statusResp.data.state
            Write-Host "Upload state attempt $i/$($maxAttempts): $state"

            if ($state -eq "available") {
              $isAvailable = $true
              break
            }

            Start-Sleep -Seconds $delaySeconds
          }

          if (-not $isAvailable) {
            throw "Upload did not become available in time."
          }

          Write-Host "Verifying Nexus mod access for mod_id=$env:NEXUS_MOD_ID..."
          try {
            $modResp = Invoke-RestMethod `
              -Method GET `
              -Uri "$env:NEXUS_API_BASE/games/palworld/mods/$env:NEXUS_MOD_ID" `
              -Headers @{ "apikey" = $env:NEXUS_API_KEY }

            $modName = if ($modResp.data.name) { $modResp.data.name } else { "unknown" }
            Write-Host "Nexus mod verified: $modName (id=$env:NEXUS_MOD_ID)"
          }
          catch {
            $detail = $_.Exception.Message
            throw "Nexus mod verification failed for game='palworld', mod_id=$env:NEXUS_MOD_ID. Check that the personal API key is from the same Nexus account that owns the mod, and that the mod ID is correct. Details: $detail"
          }

          $createModFileBody = @{
            upload_id = $uploadId
            name = $env:FILE_NAME
            version = $fileVersion
            file_category = $env:FILE_CATEGORY
            allow_mod_manager_download = $false
            primary_mod_manager_download = $true
            update_mod_version = $true
          } | ConvertTo-Json

          Write-Host "Creating mod file on Nexus (mod_id=$env:NEXUS_MOD_ID)..."
          $createModFileResp = Invoke-RestMethod `
            -Method POST `
            -Uri "$env:NEXUS_API_BASE/mods/$env:NEXUS_MOD_ID/files" `
            -Headers $headers `
            -Body $createModFileBody

          $createdFileId = $createModFileResp.data.id
          $createdFileScopedId = $createModFileResp.data.game_scoped_id
          Write-Host "Created Nexus mod file id=$createdFileId game_scoped_id=$createdFileScopedId"
